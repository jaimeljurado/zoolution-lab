<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Zoolutions Lab · Volvemos pronto</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #000; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(100%, 700px); padding: 64px 28px; text-align: center; }
    .door { width: 30px; height: 66px; margin: 0 auto 52px; background: #fff; box-shadow: 0 0 42px rgba(255,255,255,.2); }
    .brand { margin: 0 0 24px; color: #a3a3a3; font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 54px); font-weight: 500; line-height: 1.12; letter-spacing: -.045em; text-wrap: balance; }
    .note { margin: 24px 0 0; color: #858585; font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="door" aria-hidden="true"></div>
    <p class="brand">Zoolutions Lab</p>
    <h1>Estamos preparando<br>algo nuevo.</h1>
    <p class="note">Estamos mejorando nuestra web. Volvemos pronto.</p>
  </main>
</body>
</html>
