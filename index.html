<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zoolutions Lab · En mantenimiento</title>
<meta name="description" content="Zoolutions Lab está en mantenimiento. Volvemos muy pronto.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="assets/favicon-v60.png">
<style>
@font-face{font-family:"Departure Mono";src:url("assets/fonts/departure-mono.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Inter";src:url("assets/fonts/inter-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url("assets/fonts/inter-500.woff2") format("woff2");font-weight:500;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;height:100vh;height:100svh;background:#000 url("assets/zl-cabra-inicial-poster.jpg") center/cover no-repeat;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:scale(.84);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 22%,transparent 55%,rgba(0,0,0,.78))}
.brand{position:absolute;z-index:3;top:clamp(18px,2.6vw,34px);left:clamp(18px,3vw,48px);display:flex;align-items:flex-end;gap:clamp(10px,1vw,14px)}
.brand .door{height:clamp(58px,6vw,88px);width:auto;display:block}
.brand .stack{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(4px,.45vw,7px);margin-bottom:1px}
.brand .stack img{height:clamp(15px,1.5vw,22px);width:auto;display:block}
.msg{position:absolute;z-index:3;left:clamp(18px,3vw,48px);bottom:clamp(30px,7vh,76px);max-width:min(30vw,440px);text-align:left}
.kick{display:inline-flex;align-items:center;gap:10px;font:400 clamp(11px,.95vw,13px)/1 "Departure Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.kick i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 2.4s ease-in-out infinite}
h1{margin-top:16px;white-space:nowrap;font-weight:500;font-size:clamp(26px,2.9vw,44px);line-height:1.04;letter-spacing:-.045em;text-shadow:0 0 30px rgba(0,0,0,.8)}
h1 span{color:rgba(255,255,255,.42)}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media(max-aspect-ratio:4/5){.stage video{transform:none;-webkit-mask-image:none;mask-image:none}.brand .door{height:48px}.brand .stack img{height:14px}.msg{left:0;right:0;max-width:none;padding:0 20px;text-align:center;bottom:max(30px,env(safe-area-inset-bottom))}h1{font-size:clamp(24px,7vw,34px)}}
@media(prefers-reduced-motion:reduce){.kick i{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="stage">
  <video autoplay muted loop playsinline preload="auto" poster="assets/zl-cabra-inicial-poster.jpg" aria-hidden="true"><source src="assets/zl-cabra-inicial-v60.mp4" type="video/mp4"></video>
</div>
<a class="brand" href="./" aria-label="Zoolutions Lab"><img class="door" src="assets/logo-door-v60.png" alt="" width="324" height="603"><span class="stack"><img src="assets/logo-zoolutions-v60.png" alt="Zoolutions" width="547" height="96"><img src="assets/logo-lab-v60.png" alt="Lab" width="186" height="96"></span></a>
<main class="msg">
  <p class="kick"><i></i>Web en mantenimiento</p>
  <h1>Estamos afinando la web.<br><span>Volvemos muy pronto.</span></h1>
</main>
</body>
</html>
